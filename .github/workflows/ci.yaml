---
name: 'Run standard CI'

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
      - uses: './.github/actions/setup-aqua'
      - name: 'Run linters'
        run: 'lefthook run pre-commit --all-files'
